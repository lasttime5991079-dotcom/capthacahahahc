name: CAPTCHA Bot Test

on:
  workflow_dispatch: # Yeh aapko GitHub par manual "Run Workflow" ka button dega

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase

      - name: Install Virtual Display (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool

      - name: Run Script with Virtual Display
        run: |
          # xvfb-run server ko ek naqli screen deta hai taake mouse clicks kaam karein
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python test_bot.py

      - name: Upload Screenshots as Evidence
        uses: actions/upload-artifact@v4
        # Agar script fail bhi ho jaye, tab bhi yeh step chal kar screenshot upload karega
        if: always() 
        with:
          name: bot-screenshots
          path: '*.png'
